name: hosting
description: Blaze Hosting — isolated native client for panel.nawazfx.com
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  path_provider: ^2.1.5
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/login-hero.png

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: assets/logo.png
  image_path: assets/logo.png
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: assets/logo.png
