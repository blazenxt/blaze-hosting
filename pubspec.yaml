name: hosting
description: Blaze Hosting — isolated client for your own servers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  firebase_remote_config: ^5.2.1
  package_info_plus: ^8.1.1
  dio: ^5.7.0
  path_provider: ^2.1.5
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/logo.png
    background_color: "#080808"
    theme_color: "#C94F59"
  windows:
    generate: true
    image_path: assets/logo.png
  macos:
    generate: true
    image_path: assets/logo.png
  image_path: assets/logo.png
  adaptive_icon_background: "#080808"
  adaptive_icon_foreground: assets/logo.png
